[package]
name = "mmap"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Memory map visualizer for Linux processes (OS course assignment, educational use only)"
publish = false

[[bin]]
name = "mmap"
path = "mmap.rs"

[dependencies]
# ratatui draws the TUI; its crossterm backend is re-exported as ratatui::crossterm.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
